      frame_ids: []

  - case_id: fcs_reset_fcs_bit_2min
    input: cases/fcs_reset_fcs_bit_2min/dcs_bios_raw.jsonl
    session_id: replay-eval-fcs-reset-fcs-bit-2min
    vision:
      saved_games_dir: cases/fcs_reset_fcs_bit_2min/Saved Games/DCS
      session_id: replay-eval-fcs-reset-fcs-bit-2min
    expected:
      step_id: S18
      overlay_target: fcs_bit_switch
      requires_visual_confirmation: true
      vision_status: available
      sync_status: matched_past
